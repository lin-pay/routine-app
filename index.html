<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Daily">
<meta name="theme-color" content="#0F1117">
<title>Daily</title>
<link rel="apple-touch-icon" href="icon-daily.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0F1117;--surface:rgba(255,255,255,0.04);--sh:rgba(255,255,255,0.07);--border:rgba(255,255,255,0.06);--text:#E8E6F0;--dim:rgba(255,255,255,0.35);--mid:rgba(255,255,255,0.55);--accent:#E8A842;--aglow:rgba(232,168,66,0.15);--done:rgba(232,168,66,0.08);--doneb:rgba(232,168,66,0.12);--danger:#E05252;--r:14px;--font:'Zen Kaku Gothic New',-apple-system,sans-serif;--st:env(safe-area-inset-top,20px);--sb:env(safe-area-inset-bottom,20px)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--font)}
body{display:flex;flex-direction:column;max-width:480px;margin:0 auto;position:relative}
.app{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.app-inner{padding:calc(var(--st) + 12px) 20px calc(var(--sb) + 70px)}
.login-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;padding:20px;text-align:center}
.login-icon{font-size:64px;margin-bottom:16px}
.login-title{font-size:24px;font-weight:900;margin-bottom:8px;background:linear-gradient(135deg,#E8A842,#D4793A);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.login-desc{font-size:13px;color:var(--dim);margin-bottom:32px;line-height:1.6}
.login-btn{display:flex;align-items:center;gap:10px;background:#fff;color:#333;border:none;border-radius:12px;padding:14px 28px;font-size:15px;font-weight:700;font-family:var(--font);cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,0.3)}
.login-btn:active{transform:scale(0.95)}
.login-btn img{width:20px;height:20px}
/* Bottom tabs */
.btabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;display:flex;background:rgba(15,17,23,0.95);backdrop-filter:blur(12px);border-top:1px solid var(--border);padding:8px 0 calc(var(--sb) + 4px);z-index:40}
.btab{flex:1;background:none;border:none;color:var(--dim);font-size:10px;font-weight:700;font-family:var(--font);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0}
.btab.active{color:var(--accent)}
.btab-icon{font-size:20px}
/* Header */
.header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:24px}
.date-label{font-size:12px;color:var(--dim);letter-spacing:1.5px;font-weight:500}
.greeting{font-size:22px;font-weight:900;margin-top:4px;background:linear-gradient(135deg,#E8A842,#D4793A);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hbtn{width:36px;height:36px;border-radius:10px;background:var(--surface);border:1px solid var(--border);color:var(--dim);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.hbtn:active{background:var(--sh)}
/* Progress Ring */
.pw{display:flex;justify-content:center;margin-bottom:24px}
.rc{position:relative;width:110px;height:110px}
.rc svg{width:100%;height:100%}
.rt{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center}
.rp{font-size:28px;font-weight:900;letter-spacing:-1px}
.rs{font-size:11px;color:var(--dim);margin-top:1px}
/* Cards */
.tl{display:flex;flex-direction:column;gap:6px}
.tc{display:flex;align-items:center;position:relative;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px;transition:all .3s;animation:si .3s ease both}
.tc.done{background:var(--done);border-color:var(--doneb)}
.cb{width:26px;height:26px;border-radius:8px;flex-shrink:0;border:2px solid rgba(255,255,255,0.15);background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;font-size:13px;color:#fff}
.cb.ck{background:linear-gradient(135deg,#E8A842,#D4793A);border-color:transparent}
.tb{flex:1;margin-left:12px;cursor:pointer;min-width:0}
.tn{font-size:14px;font-weight:500;line-height:1.4}
.tc.done .tn{text-decoration:line-through;opacity:.4}
.st{display:inline-flex;align-items:center;gap:2px;font-size:11px;color:var(--accent);margin-top:3px;font-weight:500}
.td{font-size:10px;color:var(--dim);margin-top:2px}
.mb{background:none;border:none;color:var(--dim);font-size:20px;cursor:pointer;padding:4px 6px;border-radius:8px}
.mb:active{background:var(--sh)}
.po{position:absolute;right:10px;bottom:calc(100% + 4px);z-index:20;background:#1E1B2E;border:1px solid var(--border);border-radius:12px;padding:4px;box-shadow:0 12px 32px rgba(0,0,0,.5);animation:pi .15s ease;min-width:120px}
.pb{background:none;border:none;font-family:var(--font);font-size:13px;cursor:pointer;padding:10px 16px;border-radius:8px;width:100%;text-align:left;white-space:nowrap;font-weight:500}
.pb.del{color:var(--danger)}.pb.edt{color:var(--text)}.pb:active{background:var(--sh)}
.empty{text-align:center;padding:50px 20px;animation:fi .5s ease}
.ei{font-size:48px;margin-bottom:12px}
.et{font-size:17px;font-weight:700;margin-bottom:6px}
.ed{font-size:13px;color:var(--dim);line-height:1.5}
.fab{position:fixed;bottom:calc(var(--sb) + 64px);right:24px;width:54px;height:54px;border-radius:16px;background:linear-gradient(135deg,#E8A842,#D4793A);border:none;color:#fff;font-size:28px;font-weight:300;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 28px rgba(232,168,66,.35);z-index:30;animation:pi .4s ease .2s both}
.fab:active{transform:scale(.92)}
/* Week schedule */
.wk-day{margin-bottom:10px}
.wk-label{display:flex;align-items:center;gap:8px;padding:8px 0 6px;font-size:13px;font-weight:700}
.wk-today{background:var(--aglow);border-radius:8px;padding:2px 8px;color:var(--accent)}
.wk-tasks{display:flex;flex-direction:column;gap:4px;padding-left:4px}
.wk-task{font-size:13px;color:var(--mid);padding:6px 10px;background:var(--surface);border:1px solid var(--border);border-radius:8px}
.wk-none{font-size:12px;color:var(--dim);padding:4px 10px;font-style:italic}
/* Form */
.fv{animation:su .3s ease}
.stl{font-size:18px;font-weight:900;margin-bottom:20px}
.ig{margin-bottom:22px}
.il{display:block;font-size:11px;font-weight:700;color:var(--dim);margin-bottom:8px;letter-spacing:1.5px;text-transform:uppercase}
.ti{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px;color:var(--text);font-size:15px;font-family:var(--font);outline:none}
.ti:focus{border-color:rgba(232,168,66,.4)}
.ti::placeholder{color:var(--dim)}
.dg{display:flex;gap:6px}
.db{flex:1;aspect-ratio:1;border-radius:10px;background:var(--surface);border:1.5px solid var(--border);color:var(--mid);font-size:13px;font-weight:700;font-family:var(--font);cursor:pointer;display:flex;align-items:center;justify-content:center}
.db.ac{background:var(--aglow);border-color:var(--accent);color:var(--accent)}
.db:active{transform:scale(.92)}
.ps{display:flex;gap:6px;margin-bottom:10px}
.psb{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:6px 12px;font-size:11px;color:var(--mid);font-family:var(--font);cursor:pointer;font-weight:500}
.psb.ac{background:var(--aglow);border-color:var(--accent);color:var(--accent)}
.psb:active{background:var(--sh)}
.icg{display:flex;flex-wrap:wrap;gap:6px}
.icb{width:42px;height:42px;border-radius:10px;background:var(--surface);border:1px solid var(--border);font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.icb.ac{background:var(--aglow);border-color:var(--accent);transform:scale(1.1)}
.icb:active{transform:scale(.9)}
.fa{display:flex;gap:10px;margin-top:28px}
.bc{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;color:var(--mid);font-size:15px;font-family:var(--font);font-weight:500;cursor:pointer}
.bs{flex:2;background:linear-gradient(135deg,#E8A842,#D4793A);border:none;border-radius:12px;padding:14px;color:#fff;font-size:15px;font-family:var(--font);font-weight:700;cursor:pointer}
.bs:disabled{opacity:.35}
.bc:active{background:var(--sh)}
/* Fitness */
.dn{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:10px 14px}
.dnb{background:none;border:none;color:var(--mid);font-size:18px;cursor:pointer;padding:4px 8px}
.dnb:active{color:var(--accent)}
.dnc{text-align:center}
.dnd{font-size:15px;font-weight:700}
.dns{font-size:11px;color:var(--dim);margin-top:2px}
.today-badge{font-size:9px;background:var(--accent);color:#000;border-radius:4px;padding:1px 5px;margin-left:6px;font-weight:700}
.ftabs{display:flex;gap:6px;margin-bottom:16px}
.ftab{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:8px;font-size:12px;font-weight:700;font-family:var(--font);cursor:pointer;color:var(--mid);text-align:center}
.ftab.active{background:var(--aglow);border-color:var(--accent);color:var(--accent)}
.ftab:active{transform:scale(.97)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:8px}
.card-title{font-size:12px;font-weight:700;color:var(--dim);margin-bottom:10px;letter-spacing:1px;text-transform:uppercase}
.set-row{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.set-label{font-size:11px;color:var(--dim);width:32px;flex-shrink:0}
.set-input{flex:1;background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:8px;padding:8px 10px;color:var(--text);font-size:14px;font-family:var(--font);outline:none;text-align:center}
.set-input:focus{border-color:rgba(232,168,66,.3)}
.set-unit{font-size:11px;color:var(--dim);width:24px;flex-shrink:0}
.prev-val{font-size:10px;color:var(--dim);margin-bottom:8px}
.summary-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px}
.summary-val{font-weight:700;color:var(--accent)}
.report-btn{width:100%;padding:14px;margin-top:8px;background:var(--aglow);border:1px solid rgba(232,168,66,.2);border-radius:12px;color:var(--accent);font-size:13px;font-weight:700;font-family:var(--font);cursor:pointer}
.report-btn:active{transform:scale(.97)}
.toast{position:fixed;bottom:calc(var(--sb) + 80px);left:50%;transform:translateX(-50%);background:rgba(30,27,46,.95);border:1px solid rgba(232,168,66,.2);border-radius:12px;padding:10px 20px;font-size:13px;font-weight:500;color:var(--accent);z-index:60;white-space:nowrap;animation:ti .3s ease}
.bd{position:fixed;inset:0;z-index:15}
.lw{display:flex;align-items:center;justify-content:center;height:100vh}
.sp{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:sn .8s linear infinite}
@keyframes si{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes su{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes fi{from{opacity:0}to{opacity:1}}
@keyframes pi{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
@keyframes ti{from{opacity:0;transform:translate(-50%,12px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes sn{to{transform:rotate(360deg)}}
/* Fitness redesign — dark green + monospace */
.fit-wrap{font-family:'JetBrains Mono','SF Mono','Fira Code',monospace;color:#e8e8f0}
.fit-header{padding:20px 0 8px;border-bottom:1px solid #1e1e30;position:relative}
.fit-title{font-size:13px;font-weight:700;letter-spacing:4px;color:#4ade80}
.fit-subtitle{font-size:10px;color:#6b6b80;margin-top:4px;letter-spacing:1px}
.fit-save{position:absolute;right:0;top:20px;font-size:10px;color:#4ade80;opacity:.7}
.fit-dn{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid #1e1e30}
.fit-dnb{background:none;border:none;color:#6b6b80;font-size:18px;cursor:pointer;padding:8px 12px}
.fit-dnb:active{color:#4ade80}
.fit-dnc{text-align:center;flex:1}
.fit-dnd{font-size:16px;font-weight:600;color:#e8e8f0;font-family:'JetBrains Mono',monospace}
.fit-dns{font-size:11px;color:#6b6b80;margin-top:2px}
.fit-today{font-size:9px;background:#4ade80;color:#0a0a0f;padding:1px 6px;border-radius:3px;margin-left:8px;font-weight:700;vertical-align:middle}
.fit-tabs{display:flex;gap:0;border-bottom:1px solid #1e1e30;margin-bottom:12px}
.fit-tab{flex:1;padding:10px 0;background:none;border:none;border-bottom:2px solid transparent;color:#6b6b80;font-size:12px;cursor:pointer;font-family:'JetBrains Mono',monospace;font-weight:500;transition:color .2s}
.fit-tab.active{border-bottom-color:#4ade80;color:#4ade80;font-weight:700}
.fit-section{margin-bottom:20px}
.fit-sh{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;padding:12px 0 8px;color:#e8e8f0}
.fit-sh-icon{font-size:16px}
.fit-ex{background:#14141f;border-radius:8px;border:1px solid #1e1e30;padding:12px 14px;margin-bottom:10px}
.fit-ex-name{font-size:13px;font-weight:600;margin-bottom:2px;display:flex;align-items:center;gap:6px}
.fit-bw{font-size:9px;background:#1a3a28;color:#4ade80;padding:1px 5px;border-radius:3px;font-weight:600}
.fit-ex-meta{font-size:10px;color:#6b6b80;margin-bottom:10px}
.fit-prev{color:#60a5fa}
.fit-sets{display:flex;flex-direction:column;gap:6px}
.fit-sr{display:flex;align-items:center;gap:8px}
.fit-sl{font-size:10px;color:#6b6b80;width:36px;flex-shrink:0}
.fit-in{width:64px;padding:7px 8px;background:#1a1a28;border:1px solid #2a2a40;border-radius:5px;color:#e8e8f0;font-size:13px;text-align:center;font-family:'JetBrains Mono',monospace;outline:none}
.fit-in:focus{border-color:rgba(74,222,128,.4)}
.fit-in-bw{width:80px;padding:7px 8px;background:#1a1a28;border:1px solid #2a2a40;border-radius:5px;color:#e8e8f0;font-size:13px;text-align:center;font-family:'JetBrains Mono',monospace;outline:none}
.fit-in-bw:focus{border-color:rgba(74,222,128,.4)}
.fit-sep{color:#6b6b80;font-size:12px}
.fit-rc{background:#14141f;border-radius:8px;border:1px solid #1e1e30;padding:14px}
.fit-rr{display:flex;gap:12px;margin-bottom:10px}
.fit-rf{flex:1;margin-bottom:6px}
.fit-fl{font-size:10px;color:#6b6b80;display:block;margin-bottom:4px}
.fit-iw{width:100%;padding:8px 10px;background:#1a1a28;border:1px solid #2a2a40;border-radius:5px;color:#e8e8f0;font-size:13px;box-sizing:border-box;font-family:'JetBrains Mono',monospace;outline:none}
.fit-iw:focus{border-color:rgba(74,222,128,.4)}
.fit-pace{padding:8px 10px;background:#1a1a28;border:1px solid transparent;border-radius:5px;color:#e8e8f0;font-size:13px;font-family:'JetBrains Mono',monospace}
.fit-ec{background:#14141f;border-radius:8px;border:1px solid #1e1e30;padding:14px}
.fit-ta{width:100%;padding:8px 10px;background:#1a1a28;border:1px solid #2a2a40;border-radius:5px;color:#e8e8f0;font-size:12px;min-height:56px;resize:vertical;font-family:'JetBrains Mono',monospace;box-sizing:border-box;outline:none}
.fit-ta:focus{border-color:rgba(74,222,128,.4)}
.fit-rest{background:#14141f;border-radius:8px;border:1px solid #1e1e30;padding:32px 14px;text-align:center;margin-bottom:12px}
.fit-rest em0{font-size:36px;margin-bottom:8px;display:block}
.fit-rest-t{font-size:15px;font-weight:600}
.fit-rest-s{font-size:11px;color:#6b6b80;margin-top:4px}
.fit-sp{font-size:12px;color:#6b6b80;text-align:center;margin-bottom:12px}
.fit-sg{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px;margin-bottom:16px}
.fit-si{background:#14141f;border-radius:8px;border:1px solid #1e1e30;padding:14px 8px;text-align:center}
.fit-sv{font-size:20px;font-weight:700;color:#4ade80}
.fit-sla{font-size:9px;color:#6b6b80;margin-top:4px}
.fit-ps{background:#14141f;border-radius:8px;border:1px solid #1e1e30;padding:14px;margin-bottom:12px}
.fit-pt{font-size:11px;font-weight:600;color:#6b6b80;margin-bottom:8px}
.fit-pr{display:flex;justify-content:space-between;align-items:center;padding:5px 0;font-size:12px;border-bottom:1px solid #1e1e30}
.fit-pw{font-weight:700;color:#4ade80}
.fit-wd{background:#14141f;border-radius:8px;border:1px solid #1e1e30;padding:14px;margin-bottom:12px}
.fit-wr{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:11px;border-bottom:1px solid #1e1e30}
.fit-wn{width:40px;font-weight:600;flex-shrink:0}
.fit-wt{flex:1;color:#6b6b80;font-size:10px}
.fit-wdone{color:#4ade80;font-weight:700}
.fit-wpend{color:#6b6b80}
.fit-rb{width:100%;padding:12px 0;margin-top:8px;background:#1a3a28;border:1px solid rgba(74,222,128,.25);border-radius:8px;color:#4ade80;font-size:12px;font-weight:600;cursor:pointer;font-family:'JetBrains Mono',monospace;transition:background .2s}
.fit-rb:active{background:#1a4a30}
.fit-report-body{background:#14141f;border-radius:8px;border:1px solid #1e1e30;padding:16px;font-size:12px;line-height:1.7;color:#a8a8b8;overflow-x:auto}
.fit-tr-card{background:#14141f;border-radius:8px;border:1px solid #1e1e30;padding:12px 14px;margin-bottom:8px}
.fit-tr-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px;gap:8px}
.fit-tr-name{font-size:12px;font-weight:600;color:#e8e8f0;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fit-tr-val{font-size:16px;font-weight:700;color:#4ade80;font-family:'JetBrains Mono',monospace;flex-shrink:0}
.fit-tr-unit{font-size:10px;color:#6b6b80;margin-left:3px;font-weight:500}
.fit-tr-svg{width:100%;height:48px;display:block;margin:4px 0;overflow:visible}
.fit-tr-meta{display:flex;justify-content:space-between;font-size:10px;color:#6b6b80;margin-top:4px;gap:8px}
.fit-tr-up{color:#4ade80}
.fit-tr-dn{color:#f87171}
.fit-tab{font-size:11px;letter-spacing:.5px}
/* ── Stats / continuity ── */
.sec-t{font-size:11px;font-weight:700;color:var(--dim);letter-spacing:1.5px;text-transform:uppercase;margin:22px 0 10px}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sc{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px}
.scv{font-size:24px;font-weight:900;color:var(--accent);letter-spacing:-.5px;line-height:1.1}
.scv small{font-size:12px;font-weight:700;margin-left:2px}
.scl{font-size:10px;color:var(--dim);margin-top:4px;letter-spacing:.5px}
.scs{font-size:10px;color:var(--mid);margin-top:4px}
.hmwrap{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px}
.hm{display:flex;gap:3px;align-items:stretch}
.hmw{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:3px}
.hmc{width:100%;aspect-ratio:1;border-radius:3px;background:rgba(255,255,255,.05)}
.hmc.l1{background:rgba(232,168,66,.22)}
.hmc.l2{background:rgba(232,168,66,.45)}
.hmc.l3{background:rgba(232,168,66,.7)}
.hmc.l4{background:#E8A842}
.hmc.nd{background:rgba(255,255,255,.015)}
.hmc.td{box-shadow:0 0 0 1.5px var(--accent)}
.hmdl{width:100%;aspect-ratio:1;font-size:8px;color:var(--dim);display:flex;align-items:center;justify-content:center}

function getStreak(t){let s=0;const d=new Date();if(t.days.includes(DAY_MAP[d.getDay()])&&S.comps[`${fmtD(d)}:${t.id}`])s=1;d.setDate(d.getDate()-1);for(let i=0;i<365;i++){if(t.days.includes(DAY_MAP[d.getDay()])){if(S.comps[`${fmtD(d)}:${t.id}`])s++;else break;}d.setDate(d.getDate()-1);}return s;}

// ── 週1回タスク: freq:'week' / days:[]。その週（月曜はじまり）のどこかで1回やれば完了 ──
// days が空なので、日単位の表示・統計・通知には入らない
// wdays（任意）はやる曜日の範囲（DAYS の番号。平日なら [0,1,2,3,4]）。無ければ月〜日。
// 範囲外の曜日には出さず、範囲外の日の完了は数えない（平日の毎日タスクが土日に出ないのと同じ）
function isWk(t){return t.freq==='week';}
function wkDays(t){return t.wdays&&t.wdays.length?t.wdays:[0,1,2,3,4,5,6];}
function wkOn(t,ds){return wkDays(t).includes(DAY_MAP[parseD(ds).getDay()]);}
function wkLast(t){return Math.max(...wkDays(t));}
function winName(w){const k=w.join();return k==='0,1,2,3,4'?'平日':k==='5,6'?'週末':dlStr(w);}
function wkWin(t){const w=wkDays(t);return w.length===7?'':winName(w);}
function wkLabel(t){const w=wkWin(t);return w?`週1回（${w}）`:'週1回';}
function wkStart(ds){const d=parseD(ds);d.setDate(d.getDate()-DAY_MAP[d.getDay()]);return d;}
function wkDates(ds){const d=wkStart(ds),a=[];for(let i=0;i<7;i++){a.push(fmtD(d));d.setDate(d.getDate()+1);}return a;}
// wkDates は月〜日の順なので、i がそのまま DAYS の番号
function wkDoneDay(t,ds){const w=wkDays(t);return wkDates(ds).find((s,i)=>w.includes(i)&&S.comps[`${s}:${t.id}`])||null;}
function toggleWk(id){
  const t=S.tasks.find(x=>x.id===id);if(!t)return;
  const was=!!wkDoneDay(t,S.rDate);
  if(was)wkDates(S.rDate).forEach(s=>delete S.comps[`${s}:${id}`]);else S.comps[`${S.rDate}:${id}`]=Date.now();
  saveC();
  if(!was&&isRToday()){const sk=wkStreak(t);if(MILES.indexOf(sk)>=0)celebrate('🔥',`${sk}週連続！`,`${t.icon} ${t.name}`);}
  render();
}
// 連続週数。今週まだなら先週からさかのぼる（今週の範囲の曜日が残っているうちは途切れ扱いにしない。過ぎたら 0）
function wkStreak(t){const d=wkStart(fmtD(new Date()));let n=wkDoneDay(t,fmtD(d))?1:0;if(!n&&tdi()>wkLast(t))return 0;for(let i=0;i<HIST_CAP/7;i++){d.setDate(d.getDate()-7);if(wkDoneDay(t,fmtD(d)))n++;else break;}return n;}
function wkBest(t){
  const cur=fmtD(wkStart(fmtD(new Date())));let best=0,run=0;
  for(let d=wkStart(fmtD(new Date(Math.max(t.createdAt?sod(t.createdAt):0,histStart().getTime()))));fmtD(d)<=cur;d.setDate(d.getDate()+7)){
    if(wkDoneDay(t,fmtD(d))){run++;if(run>best)best=run;}else if(fmtD(d)!==cur)run=0;
  }
  return best;
}
// 直近 n 週の達成。今週（範囲の曜日が残っているうち）と、作った週（途中から始まる）は済んだときだけ数える。範囲の最後の曜日より後に作った週は数えない
function wkRate(t,n){
  let tot=0,done=0;const d=wkStart(fmtD(new Date())),L=wkLast(t),over=tdi()>L,cw=t.createdAt?fmtD(wkStart(fmtD(new Date(t.createdAt)))):'';
  for(let i=0;i<n;i++){
    const e=new Date(d);e.setDate(e.getDate()+L);
    if(!t.createdAt||sod(t.createdAt)<=e.getTime()){const ok=!!wkDoneDay(t,fmtD(d));if(ok||((i>0||over)&&fmtD(d)!==cw)){tot++;if(ok)done++;}}
    d.setDate(d.getDate()-7);
  }
  return{pct:tot?Math.round(done/tot*100):0,done,tot};
}
function rDateLabel(){const d=rDateObj(),w=DN[d.getDay()];return `${d.getMonth()+1}月${d.getDate()}日（${w}）`;}

// ── 継続性の統計 ──
function sod(ms){const d=new Date(ms);d.setHours(0,0,0,0);return d.getTime();}
// その日に存在していた（作成済みの）該当タスク
function dayTaskList(ds){const t=parseD(ds).getTime(),di=DAY_MAP[parseD(ds).getDay()];return S.tasks.filter(x=>x.days.includes(di)&&(!x.createdAt||sod(x.createdAt)<=t));}
function dayRatio(ds){const ts=dayTaskList(ds);if(!ts.length)return null;return ts.filter(t=>S.comps[`${ds}:${t.id}`]).length/ts.length;}
// 記録の開始日（最古のタスク作成日 or 最古の完了日。HIST_CAP日が上限）
function histStart(){
  let min=null;
  S.tasks.forEach(t=>{if(t.createdAt&&(min===null||t.createdAt<min))min=t.createdAt;});
  Object.keys(S.comps).forEach(k=>{const t=parseD(k.slice(0,10)).getTime();if(min===null||t<min)min=t;});
  const cap=new Date();cap.setDate(cap.getDate()-HIST_CAP);cap.setHours(0,0,0,0);
  return new Date(Math.max(min===null?Date.now():min,cap.getTime()));
}
// 全タスク達成した日（パーフェクトデー）の現在連続数。当日未達成はまだ途切れ扱いにしない
function perfectStreak(){
  let n=0;const d=new Date();
  for(let i=0;i<HIST_CAP;i++){
    const r=dayRatio(fmtD(d));
    if(r===null){d.setDate(d.getDate()-1);continue;}
    if(r>=1)n++;else if(i>0)break;
    d.setDate(d.getDate()-1);
  }
  return n;
}
function bestPerfect(){
  const today=fmtD(new Date());let best=0,cur=0;
  for(let d=histStart();fmtD(d)<=today;d.setDate(d.getDate()+1)){
    const r=dayRatio(fmtD(d));
    if(r===null)continue;
    if(r>=1){cur++;if(cur>best)best=cur;}else if(fmtD(d)!==today)cur=0;
  }
  return best;
}
function bestStreak(t){
  const start=new Date(Math.max(t.createdAt?sod(t.createdAt):0,histStart().getTime()));
  const today=fmtD(new Date());let best=0,cur=0;
  for(let d=new Date(start);fmtD(d)<=today;d.setDate(d.getDate()+1)){
    if(!t.days.includes(DAY_MAP[d.getDay()]))continue;
    const ds=fmtD(d);
    if(S.comps[`${ds}:${t.id}`]){cur++;if(cur>best)best=cur;}
    else if(ds!==today)cur=0;
  }
  return best;
}
// 直近 days 日のタスク別達成率
function taskRate(t,days){
  let tot=0,done=0;const d=new Date();
  for(let i=0;i<days;i++){
    const ds=fmtD(d);
    if(t.days.includes(DAY_MAP[d.getDay()])&&(!t.createdAt||sod(t.createdAt)<=parseD(ds).getTime())){tot++;if(S.comps[`${ds}:${t.id}`])done++;}
    d.setDate(d.getDate()-1);
  }
  return{pct:tot?Math.round(done/tot*100):0,done,tot};
}
// 直近 days 日の全体達成率
function periodRate(days){
  let tot=0,done=0;const d=new Date();
  for(let i=0;i<days;i++){
    const ds=fmtD(d),ts=dayTaskList(ds);
    tot+=ts.length;done+=ts.filter(t=>S.comps[`${ds}:${t.id}`]).length;
    d.setDate(d.getDate()-1);
  }
  return tot?Math.round(done/tot*100):0;
}

const LSK='daily_notif_log';

function nmark(k){const l=nlog();l[k]=1;const ds=fmtD(new Date());Object.keys(l).forEach(x=>{if(x.slice(0,10)<ds)delete l[x];});try{localStorage.setItem(LSK,JSON.stringify(l));}catch(e){}}
function hm2m(v){const a=String(v||'').split(':');return(parseInt(a[0],10)||0)*60+(parseInt(a[1],10)||0);}

// 前面で動いている間、予定時刻を過ぎた通知を発火する（1日1回まで）
function checkNotifs(){
  const n=S.settings.notif;
  if(!S.user||!S.dataOk||!n.on||notifPerm()!=='granted')return;
  const now=new Date(),ds=fmtD(now),cur=now.getHours()*60+now.getMinutes(),log=nlog();
  const due=m=>{const d=cur-m;return d>=0&&d<NWIN;};
  const ts=todayTasks(),left=ts.filter(t=>!S.comps[`${ds}:${t.id}`]);
  if(n.morningOn&&ts.length&&due(hm2m(n.morning))&&!log[`${ds}:am`]){
    nmark(`${ds}:am`);fire('☀️ 今日のルーティン',`${ts.length}件 — ${nameList(ts,3)}`,'am');
  }
  if(n.taskOn)ts.forEach(t=>{
    if(!t.time||S.comps[`${ds}:${t.id}`])return;
    const k=`${ds}:t:${t.id}`;
    if(!due(hm2m(t.time))||log[k])return;
    const sk=getStreak(t);
    nmark(k);fire(`${t.icon} ${t.name}`,sk>0?`🔥 ${sk}日連続中 — 今日で${sk+1}日目`:'いま実行する時間です',`t${t.id}`);
  });
  if(n.eveningOn&&left.length&&due(hm2m(n.evening))&&!log[`${ds}:pm`]){
    const risky=left.filter(t=>getStreak(t)>=3);
    nmark(`${ds}:pm`);
    fire('🌙 未完了のルーティン',risky.length?`あと${left.length}件 — ⚠️ ${risky[0].name} の${getStreak(risky[0])}日連続が途切れます`:`あと${left.length}件 — ${nameList(left,3)}`,'pm');
  }
}

// 標準 Web Push の購読。アプリを閉じていても notify.mjs から通知が届くようになる
function b64uToBytes(s){const pad='='.repeat((4-s.length%4)%4),raw=atob((s+pad).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from(raw,c=>c.charCodeAt(0));}
// endpoint は '/' を含み Firestore のマップキーに使えないのでハッシュを鍵にする
async function subKey(ep){
  const h=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(ep));
  return [...new Uint8Array(h)].slice(0,12).map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function registerPush(){
  if(!VAPID_KEY||!swReg||!S.user||!swReg.pushManager)return;
  const opts={userVisibleOnly:true,applicationServerKey:b64uToBytes(VAPID_KEY)};
  try{
    let sub;
    try{sub=await swReg.pushManager.subscribe(opts);}
    catch(e){
      // 別の鍵で購読済みだと InvalidStateError になる。解除して取り直す
      const old=await swReg.pushManager.getSubscription();
      if(!old)throw e;
      await old.unsubscribe();
      sub=await swReg.pushManager.subscribe(opts);
    }
    const j=sub.toJSON(),k=await subKey(j.endpoint),prev=S.settings.pushSubs[k];
    if(prev&&Date.now()-(prev.at||0)<7*864e5)return;
    const rec={endpoint:j.endpoint,p256dh:j.keys.p256dh,auth:j.keys.auth,ua:navigator.userAgent.slice(0,120),at:Date.now()};
    S.settings.pushSubs[k]=rec;
    await setDoc(doc(db,'users',S.user.uid,'data','settings'),{pushSubs:{[k]:rec}},{merge:true});
  }catch(e){console.warn('push subscribe failed',e);}
}

// ── 技術士: 過去問ドリル ──
// 索引と正答は data/gq_idx、問題の画像は gq/{k}、解いた記録は data/gprog（どれもログインした本人だけが読める）
// 正答 a は番号。複数正解は配列、不成立の問題は 0（出題しない）
let gMap=null,gMapSrc=null;
function gSets(){return(S.gIdx&&S.gIdx.sets)||[];}
function gFind(k){if(gMapSrc!==S.gIdx){gMap={};gSets().forEach(s=>s.qs.forEach(q=>{gMap[q.k]={s,q};}));gMapSrc=S.gIdx;}return gMap[k];}
function gOk(q){return Array.isArray(q.a)?q.a.length>0:q.a>0;}
function gRight(q,c){return Array.isArray(q.a)?q.a.includes(c):q.a===c;}
function gAnsStr(q){return(Array.isArray(q.a)?q.a:[q.a]).map(n=>CIRC[n-1]).join('・');}
function gAnsUrl(s){const n=G_ANS[s.y];return n?`https://www.engineer.or.jp/c_topics/004/attached/attach_4106_${n}.pdf#page=${G_ANSP[s.s]}`:'';}
function gKeysOf(s){return s.qs.filter(gOk).map(q=>q.k);}
function gAll(){return gSets().flatMap(gKeysOf);}
function gDays(ds){return Math.round((parseD(ds)-parseD(fmtD(new Date())))/864e5);}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
// 期日が来た復習。前回間違えた問題を先に、あとは期日の古い順（復習がたまっても、間違えた問題が後回しにならないように）
function gDue(){const td=fmtD(new Date()),Q=S.gP.q,x=k=>Q[k].r.slice(-1)==='x'?0:1;return gAll().filter(k=>Q[k]&&Q[k].due<=td).sort((a,b)=>x(a)-x(b)||(Q[a].due<Q[b].due?-1:Q[a].due>Q[b].due?1:0));}
function gWeak(){const Q=S.gP.q;return gAll().filter(k=>Q[k]&&Q[k].r.slice(-1)==='x');}
// 今日の10問: 復習の期日が来た問題を先に、残りは新しい問題を 森林5:基礎3:適性2 で混ぜる
function gDailyKeys(){
  const due=gDue().slice(0,G_GOAL),need=G_GOAL-due.length;
  if(need<=0)return due;
  const fr={shinrin:[],kiso:[],tekisei:[]};
  shuffle(gAll().filter(k=>!S.gP.q[k])).forEach(k=>{const f=gFind(k);if(f&&fr[f.s.s])fr[f.s.s].push(k);});
  const order=['shinrin','kiso','shinrin','tekisei','shinrin','kiso','shinrin','tekisei','shinrin','kiso'],pick=[];
  for(let i=0;pick.length<need&&i<need*order.length;i++){const l=fr[order[i%order.length]];if(l.length)pick.push(l.shift());}
  return[...due,...pick];
}
function gAddD(ds,n){const d=parseD(ds);d.setDate(d.getDate()+n);return fmtD(d);}
// 記録したら true。同じ日にもう一度解いた分（間違えた問題をもう一度・通しや苦手で重なったもの）は、答えを覚えているので記録しない（予定も履歴も今日の問題数も変えない）
function gRecord(k,ok){
  const td=fmtD(new Date()),p=S.gP.q[k]||{n:0,c:0,b:0,r:''};
  if(p.l===td)return false;
  p.n++;if(ok)p.c++;
  // 初めてで正解なら14日後（知っている問題に早い復習はいらない。まぐれ当たりは2週間後に確かめる）、そのあとは正解のたびに間隔をのばす。間違えたら1週間後に戻す。
  // 期日より前に解いて正解したとき（通し・苦手で先に出た）は、期日も間隔も変えない（覚えている答えで間隔がのびないように）
  if(!ok){p.b=G_MISS;p.due=gAddD(td,G_BOX[G_MISS]);}
  else if(!p.b||!p.due||p.due<=td){p.b=Math.min(p.b?p.b+1:4,G_BOX.length-1);p.due=gAddD(td,G_BOX[p.b]);}
  p.l=td;p.r=(p.r+(ok?'o':'x')).slice(-10);
  S.gP.q[k]=p;
  const day=S.gP.days[td]||{n:0,c:0};day.n++;if(ok)day.c++;S.gP.days[td]=day;
  return true;
}
// 2026-11-02 より前の決まり（間違えたら翌日）で入っている予定を1週間後に直す。最後が×で、期日が最後に解いた日の翌日のもの。
// 直したら true（呼んだ側で保存）。何度呼んでも同じ（古いアプリが翌日で記録しても、次に開いたときに直る）
function gFixMiss(){
  let n=0;
  Object.values(S.gP.q).forEach(p=>{if(p&&p.l&&p.r&&p.r.slice(-1)==='x'&&p.due===gAddD(p.l,1)){p.b=G_MISS;p.due=gAddD(p.l,G_BOX[G_MISS]);n++;}});
  return n>0;
}
function gStats(){
  const all=gAll(),Q=S.gP.q,td=fmtD(new Date());
  let n7=0,c7=0;const d=new Date();
  for(let i=0;i<7;i++){const x=S.gP.days[fmtD(d)];if(x){n7+=x.n;c7+=x.c;}d.setDate(d.getDate()-1);}
  // 解いた日の連続（今日まだなら昨日から数える）
  let st=0;const e=new Date();if(!(S.gP.days[td]||{}).n)e.setDate(e.getDate()-1);
  for(let i=0;i<HIST_CAP;i++){if((S.gP.days[fmtD(e)]||{}).n){st++;e.setDate(e.getDate()-1);}else break;}
  return{all:all.length,seen:all.filter(k=>Q[k]).length,due:gDue().length,n7,c7,st,today:S.gP.days[td]||{n:0,c:0}};
}
// 最後に解いたときに正解だった割合
function gAcc(keys){const Q=S.gP.q,seen=keys.filter(k=>Q[k]),ok=seen.filter(k=>Q[k].r.slice(-1)==='o').length;return{n:keys.length,seen:seen.length,ok,pct:seen.length?Math.round(ok/seen.length*100):0};}
async function gLoadImg(k){
  if(!k||S.gImg[k]||!S.user)return;
  S.gImg[k]='loading';
  try{const s=await getDoc(doc(db,'users',S.user.uid,'gq',k));S.gImg[k]=s.exists()?s.data():{err:1};}catch(e){S.gImg[k]={err:1};}
  const ks=Object.keys(S.gImg);if(ks.length>40)ks.slice(0,ks.length-40).forEach(x=>{if(!S.gQ||!S.gQ.keys.slice(S.gQ.i,S.gQ.i+2).includes(x))delete S.gImg[x];});
  if(S.gQ&&S.gQ.keys[S.gQ.i]===k)render();
}
function gPrefetch(){const q=S.gQ;if(q){gLoadImg(q.keys[q.i]);gLoadImg(q.keys[q.i+1]);gXWatch([q.keys[q.i]]);}}
function gStart(mode,keys,title,set){
  if(!keys.length){toast('出せる問題がありません');return;}
  gXStop();
  S.gQ={mode,title,set:set||null,keys,i:0,pick:{}};S.gView='quiz';S.gZoom=false;
  if(mode==='set'){S.gQ.el=0;S.gQ.ta=Date.now();gRunSave(S.gQ);}
  render();gPrefetch();document.getElementById('app').scrollTop=0;
}
// 年度別の通しは1問ごとに途中経過を端末に残す。経過時間 el は操作のたびに足し、ta=null（中断中・画面を離れている間）は数えない
function gTick(q){const now=Date.now();if(q.ta)q.el+=Math.min(now-q.ta,G_GAP);q.ta=now;}
function gEl(q){return q.el+(q.ta?Math.min(Date.now()-q.ta,G_GAP):0);}
function gHM(ms){const m=Math.floor(ms/60000);return`${Math.floor(m/60)}:${String(m%60).padStart(2,'0')}`;}
function gRunSave(q){if(!S.user)return;try{localStorage.setItem(G_RUN,JSON.stringify({uid:S.user.uid,mode:q.mode,title:q.title,set:q.set,keys:q.keys,i:q.i,pick:q.pick,want:q.want,el:q.el,ta:q.ta}));}catch(e){}}
function gRunClear(){try{localStorage.removeItem(G_RUN);}catch(e){}}
function gRunGet(){try{const r=JSON.parse(localStorage.getItem(G_RUN)||'null');return r&&S.user&&r.uid===S.user.uid&&gSets().some(s=>s.id===r.set)?r:null;}catch(e){return null;}}
function gResume(r){S.gQ={...r,ta:Date.now()};delete S.gQ.uid;S.gView='quiz';S.gZoom=false;gRunSave(S.gQ);render();gPrefetch();document.getElementById('app').scrollTop=0;}
// 通しの点を記録に足す（答えた問題だけで採点）
function gTestAdd(q){
  const ans=q.keys.filter(k=>q.pick[k]);if(!ans.length)return null;
  const c=ans.filter(k=>gRight(gFind(k).q,q.pick[k])).length;
  S.gP.tests=[...S.gP.tests,{set:q.set,d:fmtD(new Date()),c,n:ans.length,sec:Math.round(q.el/1000)}].slice(-60);saveG();
  return{c,n:ans.length};
}
// 選択肢を押すと仮選択（選び直せる）。「確定」で gAnswer が採点して記録する
function gSel(c){
  const q=S.gQ;if(!q||q.pick[q.keys[q.i]]||q.tmp===c)return;
  q.tmp=c;if(q.mode==='set'){gTick(q);gRunSave(q);}
  render();
}
function gAnswer(c){
  const q=S.gQ;if(!q)return;const k=q.keys[q.i],f=gFind(k);if(!f||q.pick[k])return;
  q.pick[k]=c;const ok=gRight(f.q,c);
  if(!gRecord(k,ok)){q.nr=q.nr||{};q.nr[k]=1;}
  saveG();
  if(q.mode==='set'){gTick(q);gRunSave(q);}
  if(navigator.vibrate)try{navigator.vibrate(ok?12:[30,40,30]);}catch(e){}
  gAutoTask();render();
}
function gNext(){
  const q=S.gQ;if(!q)return;
  if(q.i<q.keys.length-1){q.i++;q.tmp=null;if(q.mode==='set'){gTick(q);gRunSave(q);}S.gZoom=false;render();gPrefetch();document.getElementById('app').scrollTop=0;}
  else gFinish();
}
function gFinish(){
  const q=S.gQ,ans=q.keys.filter(k=>q.pick[k]),c=ans.filter(k=>gRight(gFind(k).q,q.pick[k])).length;
  if(q.mode==='set'){gTick(q);q.ta=null;gRunClear();gTestAdd(q);}
  const w=q.want||{};q.result={c,n:ans.length};q.xs=ans.filter(k=>w[k]||!gRight(gFind(k).q,q.pick[k]));q.asked=q.asked||{};gXWatch(ans);
  S.gView='done';render();document.getElementById('app').scrollTop=0;
}
// 解説: 間違えた問題は Mac の gexplain.mjs が Claude で作り、users/{uid}/gx/{k} に置く。結果画面ではそれを見張って、できしだい出す
// 正解した問題は、答えたあとに「解説を見る」を押しておくと（gXWant）、結果画面で間違えた問題と一緒に出す。結果画面で押しても出せる（まだ無ければ data/gxreq で頼む）
function gXWatch(keys){
  if(!S.user)return;
  keys.forEach(k=>{if(S.gXU[k])return;S.gXU[k]=onSnapshot(doc(db,'users',S.user.uid,'gx',k),s=>{
    S.gX[k]=s.exists()?s.data():null;const q=S.gQ;
    if(S.gView==='done'||(S.gView==='quiz'&&q&&q.keys[q.i]===k&&q.pick[k]))render();
  },()=>{});});
}
// 一度できた解説は gx/{k} に残っていて、作り直さない。もう一度解いたときは、正解しても結果画面にまた出す
function gXSaved(k){const x=S.gX[k];return!!(x&&x.s==='ok');}
// 結果画面の解説の欄に出す問題: 間違えた問題・「解説を見る」を押した問題（q.xs）と前にできた解説がある問題を解いた順に、そのあとに結果画面で押した問題（q.xt）を押した順に
function gXList(q){const t=q.xt||[];return[...q.keys.filter(k=>q.pick[k]&&!t.includes(k)&&((q.xs||[]).includes(k)||gXSaved(k))),...t];}
function gXStop(){Object.values(S.gXU).forEach(u=>{try{u();}catch(e){}});S.gXU={};}
async function gXReq(k){
  const q=S.gQ;if(!S.user||!q)return;q.asked[k]=1;render();
  try{await setDoc(doc(db,'users',S.user.uid,'data','gxreq'),{q:{[k]:Date.now()}},{merge:true});}catch(e){q.asked[k]=0;toast('頼めませんでした');}
}
// 答えたあとの「解説を見る」: 結果画面に出す問題に入れる。解説がまだ無ければ（作れなかったときも）その場で頼み、解き終わるまでに Mac が作っておく。
// できている・作っている途中なら頼まない（頼むと作り直しになる）。もう一度押すと取り消し（頼んだ分はそのまま）
async function gXWant(k){
  const q=S.gQ;if(!S.user||!q||!q.pick[k])return;
  q.want=q.want||{};q.asked=q.asked||{};
  if(q.want[k])delete q.want[k];else q.want[k]=1;
  if(q.mode==='set')gRunSave(q);
  render();
  if(!q.want[k]||q.asked[k])return;
  gXWatch([k]);
  try{
    const s=await getDoc(doc(db,'users',S.user.uid,'gx',k)),x=s.exists()?s.data():null;
    if(x&&x.s!=='err')return;
    q.asked[k]=1;
    await setDoc(doc(db,'users',S.user.uid,'data','gxreq'),{q:{[k]:Date.now()}},{merge:true});
  }catch(e){q.asked[k]=0;}
}
// 今日 G_GOAL 問に達したら、ルーティンの「技術士」（link:'gq'）に✓を付ける

// 通しの時計は画面に出ている間だけ進める。表示は15秒ごとに時計の文字だけ書き換える（問題の画像は描き直さない）
document.addEventListener('visibilitychange',()=>{const q=S.gQ;if(!q||q.mode!=='set'||S.gView!=='quiz')return;if(document.hidden){gTick(q);q.ta=null;gRunSave(q);}else if(!q.ta)q.ta=Date.now();});
setInterval(()=>{const e=document.getElementById('gTm');if(e&&S.gQ&&S.gQ.mode==='set')e.textContent=`⏱ ${gHM(gEl(S.gQ))}`;},15000);
// PC: 数字キー 1〜5 で仮選択、Enter で確定・次へ、→ で次へ（入力欄にいるときと、修飾キー付きは使わない）
document.addEventListener('keydown',e=>{
  const q=S.gQ;if(S.tab!=='study'||S.gView!=='quiz'||!q||e.metaKey||e.ctrlKey||e.altKey||/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName))return;
  const pk=q.pick[q.keys[q.i]];
  if(!pk&&/^[1-5]$/.test(e.key)){e.preventDefault();gSel(+e.key);}
  else if(!pk&&q.tmp&&e.key==='Enter'){e.preventDefault();gAnswer(q.tmp);}
  else if(pk&&(e.key==='Enter'||e.key==='ArrowRight')){e.preventDefault();gNext();}
});

function renderHeatmap(weeks){
  const today=new Date();today.setHours(0,0,0,0);
  const end=new Date(today);end.setDate(end.getDate()+(6-DAY_MAP[today.getDay()]));
  const start=new Date(end);start.setDate(start.getDate()-(weeks*7-1));
  const todayS=fmtD(today);
  const labels=['月','','水','','金','','日'];
  let cols=`<div class="hmw">${labels.map(l=>`<div class="hmdl">${l}</div>`).join('')}</div>`;
  for(let w=0;w<weeks;w++){
    let cells='';
    for(let i=0;i<7;i++){
      const d=new Date(start);d.setDate(d.getDate()+w*7+i);
      const ds=fmtD(d);let cls='hmc',tip=ds;
      if(ds>todayS)cls+=' nd';
      else{
        const r=dayRatio(ds);
        if(r===null)cls+=' nd';
        else{
          cls+=r>=1?' l4':r>=.67?' l3':r>=.34?' l2':r>0?' l1':'';
          tip=`${ds} ${Math.round(r*100)}%`;
        }
      }
      if(ds===todayS)cls+=' td';
      cells+=`<div class="${cls}" title="${tip}"></div>`;
    }
    cols+=`<div class="hmw">${cells}</div>`;
  }
  return `<div class="hmwrap"><div class="hm">${cols}</div>
    <div class="hml"><span>${start.getMonth()+1}/${start.getDate()}</span><span class="hmk">少<span class="hmc"></span><span class="hmc l1"></span><span class="hmc l2"></span><span class="hmc l3"></span><span class="hmc l4"></span>全部</span><span>今日</span></div></div>`;
}

function renderFSummary(){
  const sel=parseD(S.fDate),day=sel.getDay(),diff=day===0?6:day-1;
  const ws=new Date(sel);ws.setDate(ws.getDate()-diff);
  const we=new Date(ws);we.setDate(we.getDate()+6);
  let wkCount=0,runCount=0,totalDist=0,weights=[],prs={},bwPrs={};
  const allEx=[...WORKOUTS.A,...WORKOUTS.B,...WORKOUTS.C];
  const exMap={};const bwMap={};allEx.forEach(e=>{exMap[e.id]=e.name;if(e.bw)bwMap[e.id]=true;});
  for(let i=0;i<7;i++){
    const d=new Date(ws);d.setDate(d.getDate()+i);const ds=fmtD(d),sch=schOf(d);
    if(S.fit.weight[ds])weights.push(parseFloat(S.fit.weight[ds]));
    if(sch.type==='workout'&&S.fit.workouts[ds]){wkCount++;const w=S.fit.workouts[ds];Object.entries(w).forEach(([exId,data])=>{
      if(bwMap[exId]){for(let s=1;s<=3;s++){const r=parseFloat(data[`s${s}r`]);if(r&&(!bwPrs[exId]||r>bwPrs[exId]))bwPrs[exId]=r;}}
      else{for(let s=1;s<=3;s++){const wt=parseFloat(data[`s${s}w`]);if(wt&&(!prs[exId]||wt>prs[exId]))prs[exId]=wt;}}
    });}
    if(sch.type==='run'&&S.fit.runs[ds]&&S.fit.runs[ds].distance){runCount++;totalDist+=parseFloat(S.fit.runs[ds].distance)||0;}
  }
  const avgW=weights.length?Math.round(weights.reduce((a,b)=>a+b,0)/weights.length*10)/10:null;

  let html=`<div class="fit-section"><div class="fit-sh"><span class="fit-sh-icon">📋</span><span>週次サマリー</span></div>`;
  html+=`<div class="fit-sp">${ws.getMonth()+1}/${ws.getDate()} 〜 ${we.getMonth()+1}/${we.getDate()}</div>`;
  html+=`<div class="fit-sg"><div class="fit-si"><div class="fit-sv">${wkCount}</div><div class="fit-sla">筋トレ</div></div><div class="fit-si"><div class="fit-sv">${runCount}</div><div class="fit-sla">ラン</div></div><div class="fit-si"><div class="fit-sv">${totalDist.toFixed(1)}</div><div class="fit-sla">走行km</div></div><div class="fit-si"><div class="fit-sv">${avgW||'—'}</div><div class="fit-sla">平均体重</div></div></div>`;

  if(Object.keys(prs).length>0||Object.keys(bwPrs).length>0){
    html+=`<div class="fit-ps"><div class="fit-pt">今週の最大重量</div>`;
    Object.entries(prs).forEach(([id,w])=>{html+=`<div class="fit-pr"><span>${exMap[id]||id}</span><span class="fit-pw">${w}kg</span></div>`;});
    Object.entries(bwPrs).forEach(([id,r])=>{html+=`<div class="fit-pr"><span>${exMap[id]||id}</span><span class="fit-pw">${r}回</span></div>`;});
    html+=`</div>`;
  }

  html+=`<div class="fit-wd"><div class="fit-pt">日別ログ</div>`;
  for(let i=0;i<7;i++){
    const d=new Date(ws);d.setDate(d.getDate()+i);const ds=fmtD(d),dow=d.getDay(),sch=schOf(d);

function renderFTrend(){
  const allEx=[...WORKOUTS.A,...WORKOUTS.B,...WORKOUTS.C];
  // Merge by name (pullupA/B/C → 懸垂)
  const byName={};
  allEx.forEach(ex=>{if(!byName[ex.name])byName[ex.name]={bw:!!ex.bw,sets:ex.sets,points:[]};});
  Object.keys(S.fit.workouts).sort().forEach(ds=>{
    const w=S.fit.workouts[ds];
    allEx.forEach(ex=>{
      if(w[ex.id]){
        const data=w[ex.id],target=byName[ex.name],key=ex.bw?'r':'w';
        const vals=[];
        for(let s=1;s<=ex.sets;s++){const v=parseFloat(data[`s${s}${key}`]);if(v>0)vals.push(v);}
        if(vals.length){
          const avg=vals.reduce((a,b)=>a+b,0)/vals.length;
          // 自重(回)は整数、重量(kg)は0.5kg刻みに丸め
          const rounded=ex.bw?Math.round(avg):Math.round(avg*2)/2;
          target.points.push({date:ds,val:rounded});
        }
      }
    });
  });
  // Body weight
  const wPoints=Object.keys(S.fit.weight).filter(d=>S.fit.weight[d]).sort().map(d=>({date:d,val:parseFloat(S.fit.weight[d])})).filter(p=>!isNaN(p.val));
  // Run data
  const runDates=Object.keys(S.fit.runs).filter(d=>S.fit.runs[d]&&S.fit.runs[d].distance).sort();
  const runDist=runDates.map(d=>({date:d,val:parseFloat(S.fit.runs[d].distance)||0})).filter(p=>p.val>0);
  const runPace=runDates.map(d=>{const r=S.fit.runs[d],dist=parseFloat(r.distance)||0,dur=parseFloat(r.duration)||0;return dist>0&&dur>0?{date:d,val:dur/dist}:null;}).filter(Boolean);
  const runHr=runDates.map(d=>{const hr=parseFloat(S.fit.runs[d].hr)||0;return hr>0?{date:d,val:hr}:null;}).filter(Boolean);

  // Build series list (in display order)
  const series=[{name:'体重',points:wPoints,unit:'kg',opts:{lowerBetter:true}}];
  const seen={};
  allEx.forEach(ex=>{if(!ex.bw&&!seen[ex.name]){seen[ex.name]=1;const d=byName[ex.name];if(d.points.length)series.push({name:ex.name,points:d.points,unit:'kg',opts:{}});}});
  allEx.forEach(ex=>{if(ex.bw&&!seen[ex.name]){seen[ex.name]=1;const d=byName[ex.name];if(d.points.length)series.push({name:ex.name,points:d.points,unit:'回',opts:{}});}});
  if(runDist.length)series.push({name:'ラン距離',points:runDist,unit:'km',opts:{}});
  if(runPace.length)series.push({name:'ランペース',points:runPace,unit:'/km',opts:{paceFmt:true,lowerBetter:true}});
  if(runHr.length)series.push({name:'平均心拍',points:runHr,unit:'bpm',opts:{lowerBetter:true}});

  // Global date range across all series
  let minT=Infinity,maxT=-Infinity;
  series.forEach(s=>s.points.forEach(p=>{const t=parseD(p.date).getTime();if(t<minT)minT=t;if(t>maxT)maxT=t;}));

  let html=`<div class="fit-section"><div class="fit-sh"><span class="fit-sh-icon">📈</span><span>記録の推移</span></div>`;
  if(!isFinite(minT)){
    html+=`<div class="fit-rest"><span style="font-size:36px;display:block;margin-bottom:8px">📊</span><div class="fit-rest-t">記録がまだありません</div><div class="fit-rest-s">記録タブから入力すると推移が表示されます</div></div>`;
  }else{
    const fmtMD=t=>{const d=new Date(t);return `${d.getMonth()+1}/${d.getDate()}`;};
    html+=`<div class="fit-sp">${fmtMD(minT)} 〜 ${fmtMD(maxT)}（共通スケール）</div>`;
    series.forEach(s=>{if(s.points.length)html+=trendCard(s.name,s.points,s.unit,s.opts,minT,maxT);});
  }
  html+=`</div>`;
  return html;
}
function trendCard(name,points,unit,opts,minT,maxT){
  if(!points||!points.length)return '';
  opts=opts||{};
  const last=points[points.length-1],first=points[0];
  const vals=points.map(p=>p.val);
  const max=Math.max(...vals),min=Math.min(...vals),range=max-min||Math.max(max*0.1,1);
  const W=300,H=48,P=4;
  const tRange=(maxT-minT)||1;
  const xOf=p=>maxT===minT?W/2:P+((parseD(p.date).getTime()-minT)/tRange)*(W-P*2);
  const yOf=p=>H-P-((p.val-min)/range)*(H-P*2);
  let path='';
  points.forEach((p,i)=>{path+=`${i===0?'M':'L'}${xOf(p).toFixed(1)},${yOf(p).toFixed(1)} `;});
  // Area fill path
  let area='';
  if(points.length>1){
    area=path+`L${xOf(last).toFixed(1)},${H-P} L${xOf(first).toFixed(1)},${H-P} Z`;
  }
  let dots='';
  points.forEach(p=>{dots+=`<circle cx="${xOf(p).toFixed(1)}" cy="${yOf(p).toFixed(1)}" r="2" fill="#4ade80"/>`;});
  const fmt=v=>opts.paceFmt?`${Math.floor(v)}:${String(Math.round((v-Math.floor(v))*60)).padStart(2,'0')}`:(Math.round(v*10)/10);
  const delta=points.length>1?last.val-first.val:0;
  let deltaCls='',deltaStr='—';
  if(points.length>1&&delta!==0){
    const isImprove=opts.lowerBetter?delta<0:delta>0;
    deltaCls=isImprove?'fit-tr-up':'fit-tr-dn';
    const arrow=delta>0?'▲':'▼';
    const absD=Math.abs(delta);
    deltaStr=`${arrow} ${opts.paceFmt?fmt(absD):(Math.round(absD*10)/10)}${opts.paceFmt?'':unit}`;
  }
  return `<div class="fit-tr-card">
    <div class="fit-tr-head"><div class="fit-tr-name">${esc(name)}</div><div class="fit-tr-val">${fmt(last.val)}<span class="fit-tr-unit">${unit}</span></div></div>
    <svg class="fit-tr-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
      ${area?`<path d="${area}" fill="rgba(74,222,128,0.08)"/>`:''}
      <path d="${path}" fill="none" stroke="#4ade80" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
      ${dots}
    </svg>
    <div class="fit-tr-meta"><span>${points.length}回</span><span class="${deltaCls}">${deltaStr}</span><span>${first.date.slice(5)} → ${last.date.slice(5)}</span></div>
  </div>`;
}
function mdToHtml(md){
  const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const ph=[];const tok=h=>{ph.push(h);return '\x00PH'+(ph.length-1)+'\x00';};
  // テーブル→プレースホルダー
  md=md.replace(/(^\|.+$\n?)+/gm,block=>{
    const rows=block.trim().split('\n');
    let h='<table style="width:100%;border-collapse:collapse;font-size:11px;margin:8px 0">';
    let hdrDone=false;
    rows.forEach(r=>{
      const cells=r.split('|').filter(c=>c.trim());
      if(cells.every(c=>/^[\s\-:]+$/.test(c))){hdrDone=true;return;}
      const tag=!hdrDone?'th':'td';
      const bg=!hdrDone?'background:#1e1e30;':'';
      const clr=!hdrDone?'#6b6b80':'#c8c8d8';
      h+='<tr>'+cells.map(c=>`<${tag} style="padding:4px 6px;border-bottom:1px solid #1e1e30;text-align:left;${bg}color:${clr}">${esc(c.trim()).replace(/\*\*(.+?)\*\*/g,'<strong style="color:#e8e8f0">$1</strong>')}</${tag}>`).join('')+'</tr>';
    });
    return tok(h+'</table>');
  });
  // コードブロック→プレースホルダー
  md=md.replace(/```[\s\S]*?```/g,block=>{
    const inner=block.replace(/^```\w*\n?/,'').replace(/\n?```$/,'');
    return tok('<pre style="background:#1e1e30;padding:8px 10px;border-radius:6px;font-size:11px;overflow-x:auto;margin:8px 0;color:#c8c8d8">'+esc(inner)+'</pre>');
  });
  let out=esc(md)
    .replace(/^### (.+)$/gm,'<div style="font-size:13px;font-weight:700;color:#4ade80;margin:16px 0 6px">$1</div>')
    .replace(/^## (.+)$/gm,'<div style="font-size:14px;font-weight:700;color:#e8e8f0;margin:20px 0 8px;padding-bottom:6px;border-bottom:1px solid #1e1e30">$1</div>')
    .replace(/^# (.+)$/gm,'<div style="font-size:15px;font-weight:700;color:#4ade80;margin:16px 0 10px">$1</div>')
    .replace(/\*\*(.+?)\*\*/g,'<strong style="color:#e8e8f0">$1</strong>')
    .replace(/^- (.+)$/gm,'<div style="padding:2px 0 2px 12px;font-size:12px;position:relative"><span style="position:absolute;left:0;color:#4ade80">•</span>$1</div>')
    .replace(/^&gt; (.+)$/gm,'<div style="border-left:2px solid #4ade80;padding:6px 12px;margin:8px 0;font-size:12px;color:#6b6b80;font-style:italic">$1</div>')
    .replace(/---/g,'<div style="border-top:1px solid #1e1e30;margin:12px 0"></div>')
    .replace(/\n\n/g,'<div style="height:8px"></div>')
    .replace(/\n/g,'<br>');
  return out.replace(/\x00PH(\d+)\x00/g,(_,i)=>ph[i]);
}

      const e=S.gJE;if(!e)break;
      if(!(e.title||'').trim()){toast('タイトルを入れてください');break;}
      const rec={id:e.id||'j_'+Date.now(),title:e.title.trim(),when:e.when||'',role:e.role||'',issue:e.issue||'',choice:e.choice||'',result:e.result||'',tags:e.tags||[],sum:e.sum||'',created:e.created||Date.now(),updated:Date.now()};
      const i=S.gJ.findIndex(x=>x.id===rec.id);
      if(i>=0)S.gJ[i]=rec;else S.gJ=[rec,...S.gJ];
      saveJ();gjAutoTask();S.gJE=null;S.gView='jlist';toast('保存しました');
    }break;
    case 'gjDel':if(S.gJE&&S.gJE.id&&confirm('この業務記録を削除しますか？')){S.gJ=S.gJ.filter(x=>x.id!==S.gJE.id);saveJ();S.gJE=null;S.gView='jlist';toast('削除しました');}break;
  }
}

initSW();
startNotifLoop();
render();
</script>
